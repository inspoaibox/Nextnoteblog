# 用法：
#   1. 复制 .env.example 为 .env，把 DOMAIN 改成你的域名（域名需已解析到本机）
#   2. mkdir -p data && sudo chown -R 1000:1000 data
#   3. docker compose up -d --build
# 所有数据都在 ./data 目录：备份、迁移服务器只需拷贝它。
services:
  blog:
    build: .
    restart: unless-stopped
    volumes:
      - ./data:/data
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - blog
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
